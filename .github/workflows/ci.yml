name: CI/CD api-gateway

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-

      - name: Build cafeorbe-contracts
        run: |
          git clone --depth 1 https://github.com/CafeOrbe/cafeorbe-contracts.git /tmp/contracts
          cd /tmp/contracts && mvn -B install

      - name: Build and test
        run: mvn -B verify

      # MAN-01: el análisis espera el Quality Gate de SonarQube Cloud (máx. 10 min). Si no pasa, el job queda en
      # rojo y, con la protección de rama de main, el pull request no se puede integrar.
      - name: SonarQube scan y Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=600

  build-push:
    needs: ci
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build cafeorbe-contracts
        run: |
          git clone --depth 1 https://github.com/CafeOrbe/cafeorbe-contracts.git /tmp/contracts
          cd /tmp/contracts && mvn -B install

      - name: Package jar
        run: mvn -B package -DskipTests

      - name: Login to ACR
        uses: azure/docker-login@15c4aadf093404726ab2ff205b2cdd33fa6d054c  # v2
        with:
          login-server: ${{ vars.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push image
        run: |
          IMG=${{ vars.ACR_NAME }}.azurecr.io/api-gateway
          docker build -t $IMG:${{ github.sha }} -t $IMG:latest .
          docker push $IMG:${{ github.sha }}
          docker push $IMG:latest

  deploy-qa:
    needs: build-push
    if: github.ref == 'refs/heads/main'
    environment: QA
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6  # v2
        with:
          creds: '${{ secrets.AZURE_CREDENTIALS }}'

      - name: Deploy QA Container App
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # Sprint 2 (SEG-02): credencial interna, la misma en los 6 servicios.
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          # OBS-01: métricas por OTLP hacia Grafana Cloud (apagado si no se define la variable).
          OTLP_METRICS_ENABLED: ${{ vars.OTLP_METRICS_ENABLED || 'false' }}
          OTLP_METRICS_URL: ${{ vars.OTLP_METRICS_URL || 'http://localhost:4318/v1/metrics' }}
          OTLP_METRICS_AUTH: ${{ secrets.OTLP_METRICS_AUTH }}
          # SEG-03/04/05: Redis compartido (tickets, sesiones cerradas, límites). TLS por defecto.
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT || '6380' }}
          REDIS_SSL: ${{ vars.REDIS_SSL || 'true' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          RABBIT_PASSWORD: ${{ secrets.RABBIT_PASSWORD }}
        run: |
          set -euo pipefail

          # Sin estos valores el servicio arranca, pero QA queda roto: mejor fallar aquí con un mensaje claro.
          : "${INTERNAL_TOKEN:?Falta el secreto INTERNAL_TOKEN en GitHub (el mismo en los 6 repositorios)}"
          : "${REDIS_HOST:?Falta la variable REDIS_HOST en GitHub (ver PLAN_AZURE_SPRINT2.md, sección 3)}"

          APP_NAME="api-gateway"
          RESOURCE_GROUP="cafeorbe-org"
          CONTAINER_ENV="cafeorbe-qa"
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/api-gateway:${{ github.sha }}"

          az extension add --name containerapp --upgrade --only-show-errors

          if ! az containerapp show \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --only-show-errors >/dev/null 2>&1; then
            echo "La app $APP_NAME no existe en $RESOURCE_GROUP."
            echo "Provisionar apps es tarea de cafeorbe-infra, no de este pipeline."
            exit 1
          fi

          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --min-replicas 1 \
            --set-env-vars \
              "JWT_SECRET=$JWT_SECRET" \
              "INTERNAL_TOKEN=$INTERNAL_TOKEN" \
              "OTLP_METRICS_ENABLED=$OTLP_METRICS_ENABLED" \
              "OTLP_METRICS_URL=$OTLP_METRICS_URL" \
              "OTLP_METRICS_AUTH=$OTLP_METRICS_AUTH" \
              "REDIS_HOST=$REDIS_HOST" \
              "REDIS_PORT=$REDIS_PORT" \
              "REDIS_PASSWORD=$REDIS_PASSWORD" \
              "REDIS_SSL=$REDIS_SSL" \
              "IDENTITY_URL=https://identity-service.blackbay-48700ead.eastus2.azurecontainerapps.io" \
              "AUCTION_URL=https://auction-service.blackbay-48700ead.eastus2.azurecontainerapps.io" \
              "WALLET_URL=https://wallet-service.blackbay-48700ead.eastus2.azurecontainerapps.io" \
              "STREAMING_URL=https://streaming-service.blackbay-48700ead.eastus2.azurecontainerapps.io" \
              "CORS_ORIGINS=https://cafeorbe-web.vercel.app"


      - name: Smoke test
        run: |
          URL=$(az containerapp show \
            --name api-gateway \
            --resource-group cafeorbe-org \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          for i in $(seq 1 12); do
            if curl --fail --show-error --silent "https://$URL/actuator/health" 2>/dev/null; then
              echo "Health UP en intento $i"
              exit 0
            fi
            echo "Intento $i: aún no listo, esperando 15s..."
            sleep 15
          done
          echo "Health no respondió tras 12 intentos"
          exit 1

  deploy-prod:
    needs: build-push
    if: startsWith(github.ref, 'refs/tags/v')
    environment: PROD
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6  # v2
        with:
          creds: '${{ secrets.AZURE_CREDENTIALS }}'

      - name: Deploy PROD Container App
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # Sprint 2 (SEG-02): credencial interna, la misma en los 6 servicios.
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          # OBS-01: métricas por OTLP hacia Grafana Cloud (apagado si no se define la variable).
          OTLP_METRICS_ENABLED: ${{ vars.OTLP_METRICS_ENABLED || 'false' }}
          OTLP_METRICS_URL: ${{ vars.OTLP_METRICS_URL || 'http://localhost:4318/v1/metrics' }}
          OTLP_METRICS_AUTH: ${{ secrets.OTLP_METRICS_AUTH }}
          # SEG-03/04/05: Redis compartido (tickets, sesiones cerradas, límites). TLS por defecto.
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT || '6380' }}
          REDIS_SSL: ${{ vars.REDIS_SSL || 'true' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          RABBIT_PASSWORD: ${{ secrets.RABBIT_PASSWORD }}
        run: |
          set -euo pipefail

          # Sin estos valores el servicio arranca, pero QA queda roto: mejor fallar aquí con un mensaje claro.
          : "${INTERNAL_TOKEN:?Falta el secreto INTERNAL_TOKEN en GitHub (el mismo en los 6 repositorios)}"
          : "${REDIS_HOST:?Falta la variable REDIS_HOST en GitHub (ver PLAN_AZURE_SPRINT2.md, sección 3)}"

          APP_NAME="api-gateway-prod"
          RESOURCE_GROUP="cafeorbe-org"
          CONTAINER_ENV="cafeorbe-prod"
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/api-gateway:${{ github.sha }}"

          az extension add --name containerapp --upgrade --only-show-errors

          if ! az containerapp show \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --only-show-errors >/dev/null 2>&1; then
            echo "La app $APP_NAME no existe en $RESOURCE_GROUP."
            echo "Provisionar apps es tarea de cafeorbe-infra, no de este pipeline."
            exit 1
          fi

          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --min-replicas 1 \
            --set-env-vars \
              "JWT_SECRET=$JWT_SECRET" \
              "INTERNAL_TOKEN=$INTERNAL_TOKEN" \
              "OTLP_METRICS_ENABLED=$OTLP_METRICS_ENABLED" \
              "OTLP_METRICS_URL=$OTLP_METRICS_URL" \
              "OTLP_METRICS_AUTH=$OTLP_METRICS_AUTH" \
              "REDIS_HOST=$REDIS_HOST" \
              "REDIS_PORT=$REDIS_PORT" \
              "REDIS_PASSWORD=$REDIS_PASSWORD" \
              "REDIS_SSL=$REDIS_SSL" \
              "IDENTITY_URL=https://identity-service-prod.thankfulmoss-4f48ec41.eastus2.azurecontainerapps.io" \
              "AUCTION_URL=https://auction-service-prod.thankfulmoss-4f48ec41.eastus2.azurecontainerapps.io" \
              "WALLET_URL=https://wallet-service-prod.thankfulmoss-4f48ec41.eastus2.azurecontainerapps.io" \
              "STREAMING_URL=https://streaming-service-prod.thankfulmoss-4f48ec41.eastus2.azurecontainerapps.io" \
              "CORS_ORIGINS=https://cafeorbe-web.vercel.app"


      - name: Smoke test
        run: |
          URL=$(az containerapp show \
            --name api-gateway-prod \
            --resource-group cafeorbe-org \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          for i in $(seq 1 12); do
            if curl --fail --show-error --silent "https://$URL/actuator/health" 2>/dev/null; then
              echo "Health UP en intento $i"
              exit 0
            fi
            echo "Intento $i: aún no listo, esperando 15s..."
            sleep 15
          done
          echo "Health no respondió tras 12 intentos"
          exit 1
