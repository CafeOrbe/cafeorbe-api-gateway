server:
  port: 8080
  # DIS-01: al detener una réplica termina las peticiones en curso antes de apagarse.
  shutdown: graceful

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 500ms
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 10s
        ssl:
          # El certificado de ACA no cubre los FQDNs internos (*.internal.azurecontainerapps.io).
          # El tráfico entre apps del mismo entorno es interno; aceptable para el MVP.
          use-insecure-trust-manager: true
      globalcors:
        # Necesario para que los preflight (OPTIONS) se resuelvan aunque ninguna ruta los atienda
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
            allowed-methods: GET,POST,PUT,DELETE,OPTIONS
            allowed-headers: "*"
            max-age: 3600
      # Tabla de rutas por servicio. Solo se expone lo que pertenece a una historia del MVP.
      routes:
        - id: identity
          uri: ${IDENTITY_URL:http://localhost:8081}
          predicates:
            - Path=/api/sesion, /api/sesion/**
        - id: auction
          uri: ${AUCTION_URL:http://localhost:8082}
          predicates:
            - Path=/api/subastas, /api/subastas/**
        - id: wallet
          uri: ${WALLET_URL:http://localhost:8083}
          predicates:
            - Path=/api/orbes, /api/orbes/**
        - id: streaming
          uri: ${STREAMING_URL:http://localhost:8084}
          predicates:
            - Path=/api/streaming, /api/streaming/**

cafeorbe:
  jwt:
    secret: ${JWT_SECRET:cafeorbe-dev-jwt-secret-cambiar-en-prod-0123456789}
  seguridad:
    # SEG-02: credencial que el gateway agrega en X-Internal-Token a cada petición hacia los servicios.
    credencial-interna: ${INTERNAL_TOKEN:cafeorbe-dev-credencial-interna-cambiar-en-prod}
  estado:
    # redis: sesiones cerradas y límites compartidos entre réplicas. memoria: solo pruebas.
    modo: redis
  limite:
    rest:
      # SEG-03: peticiones REST por usuario y por segundo; el excedente recibe 429.
      por-segundo: ${LIMITE_REST_POR_SEGUNDO:20}

logging:
  structured:
    # OBS-01: logs JSON para Log Analytics.
    format:
      console: ${LOG_FORMAT:logstash}

management:
  # OBS-01: el ingress de Azure reparte entre réplicas, así que un scrape por la URL pública ve una al azar.
  # Cada réplica empuja sus métricas cada 10 s al endpoint OTLP de Grafana Cloud (sin Alloy). Apagado por defecto.
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
        url: ${OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
        step: ${OTLP_METRICS_STEP:10s}
        headers:
          Authorization: ${OTLP_METRICS_AUTH:}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      # DIS-01: /actuator/health/liveness y /actuator/health/readiness para las sondas de Azure Container Apps.
      probes:
        enabled: true
  health:
    redis:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
      # DIS-01 / OBS-01: réplica que reporta, para medir el reparto entre réplicas y ver cuál cae.
      instancia: ${CONTAINER_APP_REPLICA_NAME:${HOSTNAME:local}}
    distribution:
      # OBS-01 / REN-01: buckets fijos en los umbrales de los escenarios (p95 ≤ 800 ms, p99 ≤ 1,5 s, login < 3 s).
      # Un histograma completo son ~70 buckets por serie y, con varias réplicas, supera las 10 000 series del plan
      # gratuito de Grafana Cloud; con 8 buckets histogram_quantile sigue dando p95/p99 y la comparación con el
      # umbral es exacta.
      slo:
        spring.cloud.gateway.requests: 50ms,100ms,200ms,400ms,800ms,1500ms,3s,5s
        http.server.requests: 50ms,100ms,200ms,400ms,800ms,1500ms,3s,5s
